name: trigger-lsbot-build

# LSBOT_DISPATCH_TOKEN is a fine-grained PAT limited to the ls.bot repository
# with Contents: write, as required by GitHub's repository-dispatch endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ls.bot image build
        env:
          GH_TOKEN: ${{ secrets.LSBOT_DISPATCH_TOKEN }}
          LIGHTSPEED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "LSBOT_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi
          jq -n \
            --arg sha "${LIGHTSPEED_SHA}" \
            '{event_type: "lightspeed-main", client_payload: {lightspeed_sha: $sha}}' \
            | gh api --method POST repos/smartcomputer-ai/ls.bot/dispatches --input -
