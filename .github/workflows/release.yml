name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Main-branch commit or ref to publish as a snapshot
        required: true
        default: main

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, hz01, protected]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      bundle_digest: ${{ steps.release_bundle.outputs.digest }}
      git_sha: ${{ steps.identity.outputs.sha }}
      is_release: ${{ steps.identity.outputs.is_release }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    services:
      postgres:
        image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: lightspeed
          POSTGRES_PASSWORD: lightspeed
          POSTGRES_DB: lightspeed
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lightspeed"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - name: Validate release identity
        id: identity
        run: |
          set -euo pipefail
          git fetch origin main
          sha="$(git rev-parse HEAD^{commit})"
          git merge-base --is-ancestor "$sha" origin/main
          source release/metadata.env

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
            test "$(git cat-file -t "$tag")" = tag
            test "$(git rev-list -n 1 "$tag")" = "$sha"
            test "$tag" = "v$LIGHTSPEED_PRODUCT_VERSION"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$LIGHTSPEED_PRODUCT_VERSION" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify exact source
        env:
          LIGHTSPEED_TEST_POSTGRES_URL: postgres://lightspeed:lightspeed@127.0.0.1:55432/lightspeed
        run: |
          cargo test --workspace --locked
          cargo test --locked -p store-pg --test migrations_live \
            embedded_migrations_are_locked_idempotent_and_checksum_guarded \
            -- --ignored --test-threads=1
          scripts/release/verify-metadata.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Load release metadata
        run: cat release/metadata.env >> "$GITHUB_ENV"
      - name: Publish the exact release build environment
        id: build_environment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: release/build-env.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/build-env:sha-${{ steps.identity.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Build coherent artifacts once
        env:
          LIGHTSPEED_GIT_SHA: ${{ steps.identity.outputs.sha }}
          BUILD_IMAGE: ghcr.io/${{ github.repository }}/build-env@${{ steps.build_environment.outputs.digest }}
        run: LIGHTSPEED_RELEASE_BUILD_IMAGE="$BUILD_IMAGE" scripts/release/run-build-env.sh "$BUILD_IMAGE"
      - name: Build and publish server image
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: release/server.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIGHTSPEED_RELEASE_VERSION=${{ steps.identity.outputs.version }}
            LIGHTSPEED_GIT_SHA=${{ steps.identity.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}/server:sha-${{ steps.identity.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and publish Configurator MCP image
        id: configurator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: release/configurator-mcp.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIGHTSPEED_RELEASE_VERSION=${{ steps.identity.outputs.version }}
            LIGHTSPEED_GIT_SHA=${{ steps.identity.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}/configurator-mcp:sha-${{ steps.identity.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Publish standalone archives
        id: archives
        env:
          GHCR_ROOT: ghcr.io/${{ github.repository }}
          SHA_TAG: sha-${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          declare -A files=(
            [server]="$(find dist/archives -name '*-server-*' -print -quit)"
            [provider-incus]="$(find dist/archives -name '*-provider-incus-*' -print -quit)"
            [envd]="$(find dist/archives -name '*-envd-*' -print -quit)"
            [cli]="$(find dist/archives -name '*-cli-*' -print -quit)"
          )
          for name in server provider-incus envd cli; do
            oras push "$GHCR_ROOT/${name}-bundle:$SHA_TAG" \
              "${files[$name]}:application/gzip"
            digest="$(oras resolve "$GHCR_ROOT/${name}-bundle:$SHA_TAG")"
            key="${name^^}"
            key="${key//-/_}"
            echo "${key}_URL=oci://$GHCR_ROOT/${name}-bundle@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Finalize coherent manifest and bundle
        id: release_bundle
        env:
          LIGHTSPEED_SERVER_IMAGE: ghcr.io/${{ github.repository }}/server@${{ steps.server.outputs.digest }}
          LIGHTSPEED_CONFIGURATOR_MCP_IMAGE: ghcr.io/${{ github.repository }}/configurator-mcp@${{ steps.configurator.outputs.digest }}
          LIGHTSPEED_RELEASE_BUILD_IMAGE: ghcr.io/${{ github.repository }}/build-env@${{ steps.build_environment.outputs.digest }}
          LIGHTSPEED_BINARY_URL_SERVER: ${{ steps.archives.outputs.SERVER_URL }}
          LIGHTSPEED_BINARY_URL_PROVIDER_INCUS: ${{ steps.archives.outputs.PROVIDER_INCUS_URL }}
          LIGHTSPEED_BINARY_URL_ENVD: ${{ steps.archives.outputs.ENVD_URL }}
          LIGHTSPEED_BINARY_URL_CLI: ${{ steps.archives.outputs.CLI_URL }}
        run: |
          set -euo pipefail
          scripts/release/create-manifest.mjs \
            "${{ steps.identity.outputs.version }}" "${{ steps.identity.outputs.sha }}"
          scripts/release/checksums.sh
          scripts/release/verify-manifest.mjs --published
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf release-bundle.tar.gz dist
          bundle_ref="ghcr.io/${{ github.repository }}/release-bundle:sha-${{ steps.identity.outputs.sha }}"
          oras push "$bundle_ref" release-bundle.tar.gz:application/gzip
          bundle_digest="$(oras resolve "$bundle_ref")"
          [[ "$bundle_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$bundle_digest" >> "$GITHUB_OUTPUT"
      - name: Verify published server contains the recorded binary
        env:
          SERVER_IMAGE: ghcr.io/${{ github.repository }}/server@${{ steps.server.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$SERVER_IMAGE"
          container_id="$(docker create "$SERVER_IMAGE" --version)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir image-check
          docker cp "$container_id:/usr/local/bin/lightspeed-server" image-check/lightspeed-server
          cmp dist/bin/lightspeed-server image-check/lightspeed-server
          docker run --rm "$SERVER_IMAGE" --version | grep -F "${{ steps.identity.outputs.sha }}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/archives/*.tar.gz
            dist/npm/*.tgz
            dist/checksums.txt
            dist/release-manifest.json
            dist/sbom.spdx.json
            release-bundle.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightspeed-artifacts-${{ steps.identity.outputs.sha }}
          path: |
            dist/
            release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: needs.build.outputs.is_release == 'true'
    needs: build
    runs-on: [self-hosted, linux, x64, hz01, protected]
    environment: official-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.tag }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
      - name: Retrieve and verify this run's bundle by digest
        run: |
          set -euo pipefail
          root="ghcr.io/${{ github.repository }}/release-bundle"
          oras pull "$root@${{ needs.build.outputs.bundle_digest }}"
          tar -xzf release-bundle.tar.gz
          scripts/release/verify-manifest.mjs --published
          test "$(jq -r .gitSha dist/release-manifest.json)" = "${{ needs.build.outputs.git_sha }}"
          test "$(jq -r .version dist/release-manifest.json)" = "${{ needs.build.outputs.version }}"
          (cd dist && sha256sum --check checksums.txt)
      - name: Apply SemVer aliases to exact manifest digests
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          root="ghcr.io/${{ github.repository }}"

          copy_image_alias() {
            local source_ref="$1"
            local target_ref="$2"
            local expected_digest existing_digest
            expected_digest="$(crane digest "$source_ref")"
            if existing_digest="$(crane digest "$target_ref" 2>/dev/null)"; then
              test "$existing_digest" = "$expected_digest" || {
                echo "$target_ref already points at $existing_digest, not $expected_digest" >&2
                return 1
              }
            else
              crane cp "$source_ref" "$target_ref"
            fi
          }

          copy_oras_alias() {
            local source_ref="$1"
            local target_ref="$2"
            local expected_digest existing_digest
            expected_digest="$(oras resolve "$source_ref")"
            if existing_digest="$(oras resolve "$target_ref" 2>/dev/null)"; then
              test "$existing_digest" = "$expected_digest" || {
                echo "$target_ref already points at $existing_digest, not $expected_digest" >&2
                return 1
              }
            else
              oras copy "$source_ref" "$target_ref"
            fi
          }

          copy_image_alias "$(jq -er .buildImage dist/release-manifest.json)" \
            "$root/build-env:$VERSION"
          copy_image_alias "$(jq -er .images.server dist/release-manifest.json)" \
            "$root/server:$VERSION"
          copy_image_alias "$(jq -er .images.configuratorMcp dist/release-manifest.json)" \
            "$root/configurator-mcp:$VERSION"

          while IFS=$'\t' read -r manifest_key target_name; do
            source_url="$(jq -er --arg key "$manifest_key" '.binaries[$key].url' \
              dist/release-manifest.json)"
            source_ref="${source_url#oci://}"
            [[ "$source_ref" =~ @sha256:[0-9a-f]{64}$ ]]
            copy_oras_alias "$source_ref" "$root/${target_name}-bundle:$VERSION"
          done <<'EOF'
          server	server
          providerIncus	provider-incus
          envd	envd
          cli	cli
          EOF

          copy_oras_alias "$root/release-bundle@${{ needs.build.outputs.bundle_digest }}" \
            "$root/release-bundle:$VERSION"
      - name: Publish stable TypeScript client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          package_file="$(find dist/npm -maxdepth 1 -name '*.tgz' -print -quit)"
          expected_integrity="$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const digest = crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64");
            process.stdout.write(`sha512-${digest}`);
          ' "$package_file")"
          if published_integrity="$(npm view "@lightspeed/agent-client@$VERSION" dist.integrity 2>/dev/null)"; then
            test "$published_integrity" = "$expected_integrity" || {
              echo "npm version $VERSION already exists with different bytes" >&2
              exit 1
            }
          else
            npm publish "$package_file" --access public --tag latest
          fi
          npm dist-tag add "@lightspeed/agent-client@$VERSION" latest
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$TAG" --pattern release-manifest.json --dir existing-release
            cmp dist/release-manifest.json existing-release/release-manifest.json
            published_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for file in \
              dist/archives/*.tar.gz \
              dist/npm/*.tgz \
              dist/checksums.txt \
              dist/release-manifest.json \
              dist/sbom.spdx.json; do
              grep -Fx "$(basename "$file")" <<< "$published_assets"
            done
          else
            gh release create "$TAG" --verify-tag --notes-from-tag \
              dist/archives/*.tar.gz \
              dist/npm/*.tgz \
              dist/checksums.txt \
              dist/release-manifest.json \
              dist/sbom.spdx.json
          fi
