name: macOS binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to compile
        required: true
        default: main

permissions:
  contents: read

jobs:
  native-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Compile and smoke-test native Apple Silicon executables
        run: |
          cargo build --locked \
            -p temporal-server -p environment-provider-incus \
            -p environment-daemon -p cli
          target/debug/lightspeed-server --version | grep -F "$(git rev-parse HEAD)"
          target/debug/lightspeed-provider-incus --version | grep -F "$(git rev-parse HEAD)"
          target/debug/lightspeed-envd --version | grep -F "$(git rev-parse HEAD)"
          target/debug/lightspeed --version | grep -F "$(git rev-parse HEAD)"
