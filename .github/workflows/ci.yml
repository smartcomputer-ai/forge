name: ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: lightspeed
          POSTGRES_PASSWORD: lightspeed
          POSTGRES_DB: lightspeed
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lightspeed"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Exercise embedded migration ledger
        env:
          LIGHTSPEED_TEST_POSTGRES_URL: postgres://lightspeed:lightspeed@127.0.0.1:55432/lightspeed
        run: >-
          cargo test --locked -p store-pg --test migrations_live
          embedded_migrations_are_locked_idempotent_and_checksum_guarded
          -- --ignored --test-threads=1
      - run: scripts/release/verify-metadata.sh

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: |
            interop/ts-client/package-lock.json
            interop/configurator-mcp/package-lock.json
      - run: npm ci && npm run check
        working-directory: interop/ts-client
      - run: npm ci && npm run check
        working-directory: interop/configurator-mcp
